name: Score Following Server
on:
  pull_request:
    paths:
      - 'tools/score_following/**'
      - '.github/workflows/score-following.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/score_following
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install -c constraints-py313.txt '.[test,client]' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium --only-shell
      - name: Unit, security and real WebRTC / WebSocket tests
        run: |
          mkdir -p evidence/ci
          git rev-parse HEAD > evidence/ci/checkout-sha.txt
          python -m pytest -q --junitxml=evidence/ci/junit.xml
          python -m ruff check scorefollow tests scripts
          for file in scorefollow/web/*.js; do node --check "$file"; done
          node --test scripts/pcm-capture.test.mjs
          python -m scorefollow benchmark evidence/ci/benchmark
      - name: Browser PCM, Opus, controls and mobile layout
        run: |
          python -m scorefollow serve --dev > evidence/ci/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=1)
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit('server did not start')
          PY
          python scripts/browser_smoke.py
      - name: Upload test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-following-verification
          path: |
            tools/score_following/evidence/ci/
            tools/score_following/evidence/browser/
          retention-days: 3
