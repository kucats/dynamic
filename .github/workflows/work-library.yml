name: Work Library Foundation
on:
  pull_request:
    paths:
      - 'tools/dynamic/work_library.py'
      - 'tests/test_work_library.py'
      - 'docs/work-library.md'
      - '.github/workflows/work-library.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic model, resolver, fork and CLI tests
        run: python -m unittest discover -s tests -p 'test_work_library.py' -v
      - name: Syntax and patch hygiene
        run: |
          python -m compileall -q tools/dynamic/work_library.py tests/test_work_library.py
          git diff --check
