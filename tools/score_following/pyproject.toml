[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-score-following"
version = "0.1.0"
description = "Experimental stateful monophonic score following over WebRTC and WebSocket"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "numpy>=2,<3",
  "scipy>=1.14,<2", "aiortc==1.14.0", "defusedxml==0.7.1",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.11,<1"]
client = ["httpx>=0.27,<1", "websockets>=14,<18"]
[project.scripts]
scorefollow = "scorefollow.__main__:main"
[tool.setuptools]
packages = ["scorefollow"]
[tool.setuptools.package-data]
scorefollow = ["web/*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: real localhost WebSocket / WebRTC integration"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
